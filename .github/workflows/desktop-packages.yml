name: Desktop packages

# Tauri's own installers for the app (specs/tauri-ui.md, REQ-WEBUI-017),
# uploaded as workflow artifacts on every change to try out. Releases
# build the app in release.yml under the names the updater knows; the
# `preview: true` mode that made "SuperWhatsapp Preview" is no longer used.
on:
  workflow_call:
    inputs:
      preview:
        description: Build "SuperWhatsapp Preview" for a release, named superwhatsapp-preview-*.
        type: boolean
        default: false
      tag:
        description: The release tag the preview's files are named for.
        type: string
        default: ''
  push:
    branches: [main, feat/tauri-ui]
    paths: [src-tauri/**, web/**, src/**, Cargo.toml, Cargo.lock, .github/workflows/desktop-packages.yml]
  pull_request:
    paths: [src-tauri/**, web/**, .github/workflows/desktop-packages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A release's preview has a group of its own, so a push to main never
  # cancels it.
  group: desktop-packages-${{ inputs.preview && 'release' || 'push' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Linux packages build in Debian 12, like the released ones, so they
    # need glibc 2.36 or newer and Debian 12's WebKitGTK 4.1.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            container: debian:12
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            container: debian:12
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: Windows arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macOS universal
            os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
    steps:
      # Before checkout: the bare Debian image has no curl, git or
      # certificates. Steps run as root, without sudo.
      - name: Build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config file xdg-utils \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libpipewire-0.3-dev clang libclang-dev cmake perl \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust targets
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add ${{ matrix.target }}
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Front end packages
        working-directory: web
        run: npm ci
      # From the repository root, where the CLI finds src-tauri/; it runs
      # the front end's build first (beforeBuildCommand).
      - name: Build installers
        shell: bash
        run: |
          args=(--ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }})
          # An MSI version is numbers only, and Windows Installer compares
          # just the first three: a beta's MSI carries its release's number.
          if [ "$RUNNER_OS" = Windows ]; then
            # SQLCipher's vendored OpenSSL needs Strawberry Perl, which the
            # release builds get from PowerShell; Git Bash's own perl lacks
            # the modules OpenSSL's configure uses.
            export PATH="/c/Strawberry/perl/bin:$PATH"
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            args+=(--config "{\"bundle\":{\"windows\":{\"wix\":{\"version\":\"${version%%-*}\"}}}}")
          fi
          # A release's preview installs beside SuperWhatsapp under its own name
          # and identifier, so it never replaces the egui app; the Mac app
          # is signed ad hoc, as Apple silicon requires.
          if [ "${{ inputs.preview }}" = true ]; then
            args+=(--config '{"productName":"SuperWhatsapp Preview","identifier":"me.paolino.fastsapp.preview","bundle":{"macOS":{"signingIdentity":"-"}}}')
          fi
          web/node_modules/.bin/tauri build "${args[@]}"
      # Release names: superwhatsapp-preview-<tag>-<target>, never the
      # superwhatsapp-v* names the egui app's updater looks for.
      - name: Preview names
        if: inputs.preview
        shell: bash
        run: |
          mkdir -p preview
          bundle="target/${{ matrix.target }}/release/bundle"
          target="${{ matrix.target }}"
          [ "$target" = universal-apple-darwin ] && target=macos-universal
          name="superwhatsapp-preview-${{ inputs.tag || github.ref_name }}-$target"
          for file in "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage \
            "$bundle"/msi/*.msi "$bundle"/dmg/*.dmg; do
            [ -f "$file" ] && cp "$file" "preview/$name.${file##*.}"
          done
          for file in "$bundle"/nsis/*.exe; do
            [ -f "$file" ] && cp "$file" "preview/$name-setup.exe"
          done
          ls -l preview
      - uses: actions/upload-artifact@v5
        if: inputs.preview
        with:
          name: preview-${{ matrix.target }}
          path: preview/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: ${{ !inputs.preview }}
        with:
          name: zapfast-desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
