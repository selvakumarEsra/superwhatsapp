# The release workflow's Flatpak: the binary the Linux job built, packaged
# into the same sandbox as cc.superwhatsapp.SuperWhatsapp.yml describes. The
# job unpacks the release tarball into built/ beside this file first.
id: cc.superwhatsapp.SuperWhatsapp
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: superwhatsapp
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --socket=pulseaudio
  - --share=network
  # Archive encryption key.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications, which Fastframe sends straight to the server.
  - --talk-name=org.freedesktop.Notifications
  - --persist=.local/state
modules:
  - name: superwhatsapp
    buildsystem: simple
    build-commands:
      - install -Dm755 superwhatsapp /app/bin/superwhatsapp
      - install -Dm644 packaging/applications/*.desktop /app/share/applications/cc.superwhatsapp.SuperWhatsapp.desktop
      - sed -i 's/^Icon=.*$/Icon=cc.superwhatsapp.SuperWhatsapp/;s/^StartupWMClass=superwhatsapp$/StartupWMClass=cc.superwhatsapp.SuperWhatsapp/' /app/share/applications/cc.superwhatsapp.SuperWhatsapp.desktop
      - install -Dm644 packaging/icons/superwhatsapp.svg /app/share/icons/hicolor/scalable/apps/cc.superwhatsapp.SuperWhatsapp.svg
      - install -Dm644 packaging/flatpak/cc.superwhatsapp.SuperWhatsapp.metainfo.xml /app/share/metainfo/cc.superwhatsapp.SuperWhatsapp.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/superwhatsapp/LICENSE
    sources:
      - type: dir
        path: built
      # Metainfo belongs to this packaging checkout, not the portable archive.
      - type: file
        path: cc.superwhatsapp.SuperWhatsapp.metainfo.xml
        dest: packaging/flatpak
