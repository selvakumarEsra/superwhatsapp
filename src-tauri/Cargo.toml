[package]
name = "zapfast-desktop"
version = "0.21.1-beta.5"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "ZapFast's Tauri shell (specs/tauri-ui.md)"
publish = false

[lib]
name = "zapfast_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zapfast-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zapfast = { path = "..", features = ["demo"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The core still steps its state with an egui context until its state
# leaves src/app.rs (REQ-WEBUI-001); nothing is drawn with it.
egui = "0.36.2"
log = "0.4"
