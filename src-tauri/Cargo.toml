[package]
name = "superwhatsapp-desktop"
version = "0.21.1-beta.13"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "SuperWhatsapp's Tauri shell (specs/tauri-ui.md)"
publish = false

[lib]
name = "superwhatsapp_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "superwhatsapp-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
superwhatsapp = { path = "..", features = ["demo"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
jiff = "0.2"
serde_json = "1"
# Inlines pictures into `--dump-state` for browser screenshots.
base64 = "0.23"
# The core still steps its state with an egui context until its state
# leaves src/app.rs (REQ-WEBUI-001); nothing is drawn with it.
egui = "0.36.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
log = "0.4"
# The accounts' startup permits (superwhatsapp::backend::Backend::take_startup).
tokio = { version = "1", features = ["sync"] }
anyhow = "1"
# Installs updates and confirms a relaunch, as the egui build does.
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
# The log file, panic log and protocol redaction, as the egui build has.
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }

# The taskbar's unread overlay, drawn as the egui build draws it.
[target.'cfg(windows)'.dependencies]
fastframe-dock = { git = "https://github.com/crmne/fastframe", tag = "v0.15.4" }
